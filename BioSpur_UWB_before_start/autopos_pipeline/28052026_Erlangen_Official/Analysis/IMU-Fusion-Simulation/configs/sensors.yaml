# IMU sensor definitions.
#
# Units:
#   accel_noise_mg: mg at the sampled grid level for this vertical slice
#   residual_accel_bias_mg: post-I3 residual bias sigma
#   accel_bias_random_walk_mg_sqrt_s: residual random walk
#   gyro_* fields are recorded for provenance; Phase 1 position-domain
#   diagnostics do not yet consume full attitude/gyro strapdown.
#
# Datasheet fields keep the raw device-level source values. Simulation fields are
# post-calibration residuals used to generate synthetic drift from Vicon pose.
# Price gate for L10-L19: consumer/drone-grade, at least 6-axis, <=100 EUR/chip.

L0:
  name: perfect_vicon_imu
  description: perfect Vicon/OptiTrack-derived IMU diagnostic
  axes: 6
