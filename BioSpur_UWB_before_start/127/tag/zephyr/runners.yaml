# Available runners configured by board.cmake.
runners:
- jlink
- pyocd
- openocd

# Default flash runner if --runner is not given.
flash-runner: jlink

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /home/zekaixiao/ncs/v2.8.0/zephyr/boards/qorvo/decawave_dwm1001_dev
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: /home/zekaixiao/Documents/nRF_dev/BioSpur_UWB_before_start/127/merged.hex
  bin_file: /home/zekaixiao/Documents/nRF_dev/BioSpur_UWB_before_start/127/tag/zephyr/zephyr.signed.bin
  # Host tools:
  gdb: /home/zekaixiao/ncs/toolchains/b81a7cd864/opt/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb
  openocd: /usr/bin/openocd
  openocd_search:
    - /home/zekaixiao/ncs/toolchains/b81a7cd864/opt/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  jlink:
    - --dt-flash=y
    - --device=nRF52832_xxAA
    - --speed=4000
    - --reset-after-load
  pyocd:
    - --dt-flash=y
    - --target=nrf52832
  openocd:
    - --cmd-load
    - flash write_image erase
    - --cmd-verify
    - verify_image
    - --cmd-pre-init
    - set WORKAREASIZE 0x4000
    - --cmd-pre-init
    - source [find interface/jlink.cfg]
    - --cmd-pre-init
    - transport select swd
    - --cmd-pre-init
    - source [find target/nrf52.cfg]
