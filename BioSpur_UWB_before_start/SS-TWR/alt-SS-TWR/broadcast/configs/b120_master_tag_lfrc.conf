# B120 Tag Master: internal LFRC on both CPUAPP and hci_ipc/CPUNET.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH is not set
# CONFIG_NRFX_CLOCK_LFXO_TWO_STAGE_ENABLED is not set

# G0.2 instrument: expose monotone LFRC recalibration counters
# (z_nrf_clock_calibration_count / _skips_count) on the app core. These return
# -1 unless DEBUG is enabled. recal-rate(t) is the master thermal proxy (the
# nRF5340 TEMP peripheral is network-core-only; app core has no die-temp).
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_DEBUG=y

# CDC display name; product is kept stable for script matching.
CONFIG_USB_DEVICE_MANUFACTURER="Master_Tag"
CONFIG_USB_DEVICE_PRODUCT="Master_Tag_Control"
