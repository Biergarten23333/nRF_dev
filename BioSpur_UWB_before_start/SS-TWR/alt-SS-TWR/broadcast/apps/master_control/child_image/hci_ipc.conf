CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_SIMPLE_GPIO=y
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y

# Master_Anchor keeps eight low-throughput anchor-control BLE links resident.
# CPUAPP already has CONFIG_BT_MAX_CONN=10 and large ACL pools; CPUNET must not
# stay on the hci_ipc defaults (6 RX / 7 TX small ACL buffers), otherwise links
# begin dropping while A-H are being attached.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT=24
CONFIG_BT_BUF_ACL_TX_COUNT=24

# Use shorter controller scheduling slices for many quiet central links. The
# default 7500 us event/spacing is throughput-oriented and too chunky for the
# resident Anchor control plane.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=2500
CONFIG_BT_CTLR_SDC_CENTRAL_ACL_EVENT_SPACING_DEFAULT=2500
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=4
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=4
