CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# Interrupt-driven UART RX for the MODE_SCAN/MODE_GEIGER command interface. The
# legacy nRF UART has a single-byte RX register (no FIFO); polling it from the
# main loop drops command bytes whenever the loop is busy (e.g. a MODE_SCAN CIR
# hex dump). An RX ISR latches every byte into a ring; the main loop parses.
# Console TX (printk) stays poll_out and is unaffected. MODE_GEIGER never reads
# the ring, so its behaviour is unchanged.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_RESET_ON_FATAL_ERROR=y
