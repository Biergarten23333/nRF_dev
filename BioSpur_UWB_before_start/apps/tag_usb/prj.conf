CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_PRINTK=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# Keep the pure USB serial variant as lean and synchronous as possible.
# printk stays enabled for direct console output, while the Zephyr logging
# subsystem is disabled to avoid buffered log coupling during bringup.
CONFIG_LOG=n

CONFIG_BT=n
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_MCUMGR=n
CONFIG_SETTINGS=n
CONFIG_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_NET_BUF=n
CONFIG_ZCBOR=n
CONFIG_CRC=n
