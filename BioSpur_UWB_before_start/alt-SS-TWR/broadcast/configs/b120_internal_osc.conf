# B120 variant without a 32.768 kHz LFXO. Use LFRC explicitly on both
# CPUAPP and hci_ipc/CPUNET; do not inherit the nrf5340dk LFXO default.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH is not set
# CONFIG_NRFX_CLOCK_LFXO_TWO_STAGE_ENABLED is not set

# Give the second B120 a distinct CDC display name in VS Code Serial Monitor.
# Keep the original product string; VS Code primarily shows the manufacturer.
CONFIG_USB_DEVICE_MANUFACTURER="BioSpur_1"
CONFIG_USB_DEVICE_PRODUCT="BioSpur_BLE_Control"
