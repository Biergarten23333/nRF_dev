#####################################
# prj.conf — central_uart_nrf5340
# nRF5340 APP core, central-only NUS aggregator (USB-CDC)
#####################################

# ── Console 全关（CDC 只当数据口） ────────────────
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_SHELL=n
CONFIG_BOOT_BANNER=n
# 你还有 cdc_printf，所以保留 printk 也行
CONFIG_PRINTK=y

# ── USB CDC（非 console） ───────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="central_uart_nrf5340"
CONFIG_UART_LINE_CTRL=y

# ── 蓝牙 Host：Central + NUS client ─────────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=n

CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_GATT_DM=y

# 不用配对/加密的话可以关掉 SMP，减轻一点负担
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=y

# ── 多连接 + 2M PHY + DLE ───────────────────────
# 一块 RX 你打算最多连 5 个，可以先留点余量
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=0

CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y

# ── 使用 net core 上的 HCI-RPMsg 控制器 ───────────
CONFIG_BT_HCI=y
CONFIG_BT_HCI_DRIVER=y
CONFIG_BT_HCI_DRIVER_BUS=HCI_BUS_IPC
CONFIG_BT_RPMSG_NRF53=y

# 告诉板卡：需要启动 CPUNET 这一侧的镜像（hci_rpmsg）
CONFIG_BOARD_ENABLE_CPUNET=y

# ── 线程栈 / 内存（nRF5340 RAM 多一点没问题） ─────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ── 外设基础 ────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# ── 日志系统关掉，自己走 CDC 打 log ─────────────
CONFIG_LOG=n
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_REBOOT=y
