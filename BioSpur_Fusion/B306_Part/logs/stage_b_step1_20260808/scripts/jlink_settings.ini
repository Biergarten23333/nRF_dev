; Pinned J-Link settings for BSF6C53.
;
; ConnectUnderReset = 0 is the one that matters: with it set to 1 J-Link asserts
; nRESET while attaching, which would destroy .noinit, the trajectory ring and
; the wedge state on the board we are attaching to in order to READ them.
;
; This is belt-and-braces only. The scripts contain no reset command and G2
; proves the behaviour empirically on a healthy board. A settings file is a
; statement of intent; G2 is the measurement.
[CPU]
ConnectUnderReset = 0
OverrideMemMap = 0
AllowSimulation = 1
[FLASH]
CacheExcludeSize = 0x00
CacheExcludeAddr = 0x00
MinNumBytesFlashDL = 0
SkipProgOnCRCMatch = 1
VerifyDownload = 1
AllowCaching = 1
EnableFlashDL = 2
Override = 0
Device = "NRF52840_XXAA"
[GENERAL]
WorkRAMSize = 0x00
WorkRAMAddr = 0x00
RAMUsageLimit = 0x00
[SWO]
SWOLogFile = ""
