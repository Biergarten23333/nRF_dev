# v45 OPTIONAL partition map: carves a 16 KiB corpse partition off the end.
#
# NOT THE DEFAULT, AND NOT DEPLOYABLE BY OTA. READ THIS BEFORE USING IT.
# ----------------------------------------------------------------------
# CONTEXT_AUDIT item 11: the shipped pm_static.yml tiles the whole 1 MiB with
# ZERO bytes free --
#     mcuboot            0x00000-0x0c000
#     mcuboot_primary    0x0c000-0x86000   (0x7a000)
#     mcuboot_secondary  0x86000-0x100000  (0x7a000)
# -- and every scheme that finds space without moving those boundaries was
# rejected for cause: the tail of mcuboot_secondary holds MCUboot's swap
# trailer, so a corpse written there can corrupt a STAGED OTA IMAGE (fleet brick
# risk); the tail of app is inside the slot MCUboot swaps and is erased by the
# next OTA; UICR is one-shot.
#
# So the only clean carve is off the end, shrinking BOTH slots equally by 8 KiB.
# Equal slots keep boot_slots_compatible() trivially true for
# CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_WITHOUT_SCRATCH (swap-using-move):
# num_sectors_pri == num_sectors_sec == 120.
#
# THE BLOCKER: MCUboot compiles its own flash map in. Changing mcuboot_secondary
# therefore requires rebuilding AND SWD-REFLASHING MCUboot on every board. It
# cannot ship over OTA, and Stage C as specified is OTA-only. Using this file
# without that campaign produces a bootloader and an application that disagree
# about where the secondary slot ends, which breaks OTA.
#
# Headroom is not the constraint: the v45 signed image is ~232 KB against a
# 0x77e00 (491 008 B) slot, i.e. under 48 % used.
#
# Usage (deliberate, never a default):
#   west build ... -- -DPM_STATIC_YML_FILE=<abs path to this file>
#   BSF_CORPSE_FLASH_ENABLED=1
app:
  address: 0xc200
  end_address: 0x84000
  region: flash_primary
  size: 0x77e00
mcuboot:
  address: 0x0
  end_address: 0xc000
  placement:
    align:
      end: 0x1000
    before:
    - mcuboot_primary
  region: flash_primary
  size: 0xc000
mcuboot_pad:
  address: 0xc000
  end_address: 0xc200
  placement:
    align:
      start: 0x1000
    before:
    - mcuboot_primary_app
  region: flash_primary
  size: 0x200
mcuboot_primary:
  address: 0xc000
  end_address: 0x84000
  orig_span: &id001
  - app
  - mcuboot_pad
  region: flash_primary
  sharers: 0x1
  size: 0x78000
  span: *id001
mcuboot_primary_app:
  address: 0xc200
  end_address: 0x84000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0x77e00
  span: *id002
mcuboot_secondary:
  address: 0x84000
  end_address: 0xfc000
  placement:
    after:
    - mcuboot_primary
    align:
      start: 0x1000
    align_next: 0x1000
  region: flash_primary
  share_size:
  - mcuboot_primary
  size: 0x78000
# Two rotating 8 KiB slots. Two, so a second trigger in one power cycle has
# somewhere to go that is not on top of the first corpse; 8 KiB each because the
# flash container is a TRUNCATED image (32 trace entries per channel, 48 ring
# entries) and the decoder is told so rather than left to infer it.
bsf_corpse_partition:
  address: 0xfc000
  end_address: 0x100000
  region: flash_primary
  size: 0x4000
