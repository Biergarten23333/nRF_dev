# Stage B validation overlay -- SINGLE CANARY ONLY (BSF6C53).
#
# The ONLY difference from the production v45 image. Everything else -- the four
# trace channels, the dual-watermark detector, the corpse, the frozen buffer
# counts -- is identical, and `diff` over the two builds' .config files is the
# proof rather than the claim.
#
# What this adds: the V45 LEAK / V45 LEAK OFF vendor commands, which take and
# release the singleton sync_evt_pool buffer. That deliberately induces the
# suspected failure. An image carrying it must never reach the fleet, and the
# build prints a WARNING saying so.
CONFIG_BSF_V45_FAULT_INJECT=y
