# Passive diagnostic: print nearby BS tag advertisements and never connect.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="BSF-DWM-SCAN"

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y

# No allocator caller is linked; never consume "all remaining RAM".
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
