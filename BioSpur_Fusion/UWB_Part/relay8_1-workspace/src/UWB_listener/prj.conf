CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# Interrupt-driven UART RX for the MODE_* command interface. The legacy nRF UART
# has a single-byte RX register (no FIFO); polling it from the main loop drops
# command bytes whenever the loop is busy in a printk flood (CIR) or asleep
# (IDLE). An RX ISR latches every incoming byte into a ring buffer immediately;
# the main loop still does all command parsing. Console output stays poll_out.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
