# B120 variant without a 32.768 kHz LFXO. Keep this explicit so 1050070698
# cannot accidentally inherit the nrf5340dk external-crystal default.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC is not set
# CONFIG_NRFX_CLOCK_LFXO_TWO_STAGE_ENABLED is not set
