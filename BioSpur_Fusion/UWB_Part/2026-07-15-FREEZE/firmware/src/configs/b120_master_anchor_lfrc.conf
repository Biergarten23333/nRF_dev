# B120 Anchor Master: internal LFRC on both CPUAPP and hci_ipc/CPUNET.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH is not set
# CONFIG_NRFX_CLOCK_LFXO_TWO_STAGE_ENABLED is not set

# CDC display name; product is kept stable for script matching.
CONFIG_USB_DEVICE_MANUFACTURER="Master_Anchor"
CONFIG_USB_DEVICE_PRODUCT="Master_Anchor_Control"
