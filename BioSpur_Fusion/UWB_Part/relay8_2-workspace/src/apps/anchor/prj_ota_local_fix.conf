# Local recovery overrides for strict OTA debug (2026-04-02):
# - ensure BLE SMP pairing support is present on anchor side
# - force MCUmgr RW open permission branch (NCS 2.8 default otherwise is AUTHEN)
#   to avoid silent drop on unencrypted links while strict OTA is stabilized
CONFIG_BT_SMP=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
