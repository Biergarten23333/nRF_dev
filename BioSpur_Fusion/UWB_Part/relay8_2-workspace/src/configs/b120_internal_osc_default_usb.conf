# B120 internal-LFRC variant with the default BioSpur USB identity.
# Used to validate internal oscillator behavior on the 960148546 EVK without
# renaming its CDC device to BioSpur_1.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH is not set
# CONFIG_NRFX_CLOCK_LFXO_TWO_STAGE_ENABLED is not set
