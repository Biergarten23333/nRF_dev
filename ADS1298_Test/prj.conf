#####################################
# prj.conf — EMG(ADS1298) + IMU TX
# nRF52840 DK, BLE NUS + USB CDC + RTT log
#####################################

# =============================================================
#                    ★  BLE / NUS  ★
# =============================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n

# 安全 / 绑定（Just-Works + SMP，加密但不要求 PIN）
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# NUS 服务：TX = Server
CONFIG_BT_NUS=y
CONFIG_BT_NUS_CLIENT=n

# 吞吐 & MTU & PHY（跟 Gesture_Recognition 一致）
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_ACL_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_L2CAP_TX_FRAG_COUNT=3
CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_BUF_CMD_TX_COUNT=4
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 建议连接参数（约 7.5–15 ms）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 设备名在代码里动态设置（device_bt_name_get）
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# =============================================================
#                    ★  线程 / 内存  ★
# =============================================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
# CONFIG_STACK_SENTINEL=y

# =============================================================
#                    ★  日志 / Console / RTT  ★
# =============================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n         # 不占用 UART0
CONFIG_RTT_CONSOLE=y          # 控制台走 RTT，不占 CDC

# =============================================================
#                    ★  USB CDC (ADS1298 数据)  ★
# =============================================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="ADS1298 CDC"
CONFIG_USB_DEVICE_MANUFACTURER="BioSpur"

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# 不让 Console 占用 CDC（我们用 RTT Console）
# 上面已设 UART_CONSOLE=n，这里就不用再关 CONSOLE 了

# =============================================================
#                    ★  GPIO / SPI / PINCTRL / PWM  ★
# =============================================================
CONFIG_GPIO=y
CONFIG_GPIO_NRFX=y
CONFIG_PINCTRL=y

CONFIG_SPI=y

CONFIG_PWM=y
CONFIG_PWM_NRFX=y

# =============================================================
#                    ★  I²C (IMU: JY901B / WT901 等)  ★
# =============================================================
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_I2C_INIT_PRIORITY=50

# =============================================================
#                    ★  UART (预留给 UWB / BMD101 等)  ★
# =============================================================
CONFIG_UART_NRFX=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# =============================================================
#                    ★  ADC  ★
# =============================================================
# 不用 SAADC：EMG 走 ADS1298 SPI + BMD101 走 UART
CONFIG_ADC=n
CONFIG_ADC_NRFX_SAADC=n
CONFIG_ADC_ASYNC=n

# =============================================================
#                    ★  DK LED & Buttons  ★
# =============================================================
CONFIG_DK_LIBRARY=y

# =============================================================
#                    ★  libc / 浮点格式化  ★
# =============================================================
CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# =============================================================
#                    ★  同步 / 信号量上限  ★
# =============================================================
CONFIG_SEM_VALUE_MAX=32767

# =============================================================
#                    ★  电源管理  ★
# =============================================================
# 关闭自动省电，避免 SPI / USB 等被自动关掉
CONFIG_PM=n

# =============================================================
#                    ★  定时器 / 其它  ★
# =============================================================
CONFIG_NRFX_TIMER2=y
CONFIG_ASSERT=y
