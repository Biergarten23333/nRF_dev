#####################################
# prj.conf — Up to 11×Tx → 1×Rx (USB-CDC, Central-only)
#####################################

# ── Console 全关（CDC 仅作“数据口”） ─────────────────
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
# CONFIG_PRINTK=n

# ── USB CDC（非 console） ────────────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_PRODUCT="BioSpur 0001"
CONFIG_USB_DEVICE_MANUFACTURER="BioSpur"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F

# ── 蓝牙基础配置（Central-only） ─────────────────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_NUS=n
CONFIG_BT_SCAN=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_DEVICE_NAME="Central_11x"



# ── 连接与缓冲区配置 ─────────────────────────────────
CONFIG_BT_MAX_CONN=15
CONFIG_BT_MAX_PAIRED=15
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_BUF_COUNT=48
CONFIG_BT_BUF_ACL_TX_COUNT=48
CONFIG_BT_BUF_ACL_RX_COUNT=48
CONFIG_BT_BUF_CMD_TX_COUNT=6

# ── 控制器配置（使用 Zephyr 默认控制器） ─────────────
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_CTLR=y

# ── Settings（如需绑定/白名单可保留） ────────────────
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ── 线程栈 / heap ─────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ── Peripherals ───────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_DK_LIBRARY=y
CONFIG_NRFX_UARTE0=n

# ── 日志系统关闭 ─────────────────────────────────────
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_REBOOT=y
