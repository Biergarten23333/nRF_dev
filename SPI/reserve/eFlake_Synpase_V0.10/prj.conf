# =============================================================
#                    ★  BLE / NUS  ★
# =============================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Sensor-Hub"

# ―― 安全 / 绑定（Just-Works，无需按钮/PIN） ――
CONFIG_BT_SMP=y                 
CONFIG_BT_BONDABLE=y         
CONFIG_SETTINGS=y              
CONFIG_BT_SETTINGS=y            

# 若以后想用固定 PIN，请把最后的「可选固定 Passkey」段落解开

# ―― NUS 服务 ――
CONFIG_BT_NUS=y
CONFIG_BT_NUS_CLIENT=n
# ―― 吞吐 & MTU & PHY ――
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_ACL_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_L2CAP_TX_FRAG_COUNT=3 
CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_BUF_CMD_TX_COUNT=4
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 建议连接参数（7.5-15 ms）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# =============================================================
#                    ★  线程 / 内存  ★
# =============================================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768

# =============================================================
#                    ★  日志 / RTT  ★
# =============================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y          

# =============================================================
#                    ★  GPIO / PINCTRL  ★
# =============================================================
CONFIG_GPIO=y
CONFIG_GPIO_NRFX=y
CONFIG_PINCTRL=y

# =============================================================
#                    ★  I²C (JY901B)  ★
# =============================================================
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_I2C_INIT_PRIORITY=50    

# =============================================================
#                    ★  UART1 (UWB)  ★
# =============================================================
CONFIG_SERIAL=y
CONFIG_UART_NRFX=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# =============================================================
#                    ★  ADC (ECG)  ★
# =============================================================
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y

# =============================================================
#                    ★  DK LED & Buttons  ★
# =============================================================
CONFIG_DK_LIBRARY=y

# =============================================================
#                    ★  libc / 浮点格式化  ★
# =============================================================
CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# =============================================================
#                    ★  调试 / 断言  ★
# =============================================================
CONFIG_ASSERT=y

# =============================================================
#   ◆◆  可选：固定 6 位 Passkey「123456」(需要 PIN 时再启用) ◆◆
# =============================================================
# CONFIG_BT_FIXED_PASSKEY=y
# CONFIG_BT_FIXED_PASSKEY_VAL=123456


