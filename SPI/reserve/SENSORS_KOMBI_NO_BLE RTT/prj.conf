# 通用打印/控制台
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_NEWLIB_LIBC=y


# 启用 SEGGER RTT 支持
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y           # 让 Console 输出定向到 RTT
CONFIG_LOG=y                   # 启用 Zephyr 日志子系统（若用 LOG）
CONFIG_LOG_BACKEND_RTT=y       # 日志后端走 RTT
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y                   # Optional: force immediate output 

# GPIO & Pinctrl
CONFIG_PINCTRL=y
CONFIG_GPIO=y
CONFIG_GPIO_NRFX=y

# UART (用于 UWB)
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_NRFX=y
CONFIG_RING_BUFFER=y

# I2C & 传感器 (MPU6050)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_OWN_THREAD=y

# ADC (用于 ECG)
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y

# 支持 k_poll/k_poll_signal
CONFIG_POLL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

