#####################################
# prj.conf — Up to 11×Tx → 1×Rx (USB-CDC, Central-only)
#####################################

# ── Console 全关（USB CDC 只当“数据口”，不当 console） ──
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
CONFIG_PRINTK=n

# ── USB CDC（非 console，用作数据输出到 PC） ────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_PRODUCT="EIGENSPACE EMG"
CONFIG_USB_DEVICE_MANUFACTURER="EIGENSPACE x BioSpur"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F

# ── 蓝牙基础配置（Central-only，多连接 NUS 客户端） ────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n

# ★ 安全 / 配对（普通加密，无强制 MITM）★
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SIGNING=y
CONFIG_BT_PRIVACY=y

# Settings，用来存 bond / 白名单
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ── NUS 客户端（Central 读 TX 的 NUS）─────────────────────
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_NUS=n

CONFIG_BT_SCAN=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_DM=y

CONFIG_BT_DEVICE_NAME="EIGENSPACE EMG"

CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# ── 连接与缓冲区配置（多连接 + 高吞吐） ──────────────────
CONFIG_BT_MAX_CONN=15
CONFIG_BT_MAX_PAIRED=15

CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

CONFIG_BT_L2CAP_TX_BUF_COUNT=48
CONFIG_BT_BUF_ACL_TX_COUNT=48
CONFIG_BT_BUF_ACL_RX_COUNT=48

CONFIG_BT_BUF_CMD_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16

# 扫描过滤
CONFIG_BT_SCAN_FILTER_ENABLE=y

# ── 控制器配置（Zephyr Controller） ───────────────────────
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_CTLR=y

# ── 强制 GATT 需要加密 / 订阅 ─────────────────────────────
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# ── 线程栈 / heap ───────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ── Peripherals ─────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_DK_LIBRARY=y
CONFIG_NRFX_UARTE0=n

# ── 日志系统（RTT 后端；CDC 只作数据口） ────────────────
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64

CONFIG_LOG_BACKEND_UART=n

# ── Reboot（如果 app_cmd.c 用到了 sys_reboot） ───────────
CONFIG_REBOOT=y
