#####################################
# prj.conf — dual-NUS central＋per demo (USB-CDC, data-only)
#####################################

# ── Console / USB CDC ───────────────────────────
CONFIG_SERIAL=y
CONFIG_CONSOLE=n                  # 彻底无 console
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n                    # 防止 shell 把 console 又拉起来

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y           # 读取 DTR/RTS 需要

# ── USB 字符串（Product/Manufacturer/可选 Serial）──
CONFIG_USB_DEVICE_PRODUCT="BioSpur 0001"
CONFIG_USB_DEVICE_MANUFACTURER="BioSpur"
# 如需固定序列号（可选，若你所在 NCS 版本支持）：
# CONFIG_USB_DEVICE_SN="BioSpur-0001"

# 可选：自定义 VID/PID（若需要与默认区分）
# CONFIG_USB_DEVICE_VID=0x1915
# CONFIG_USB_DEVICE_PID=0x520F

# ── 日志子系统：全关（避免占带宽/CPU） ────────────
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
# 若你之前开启过 RTT 后端，这里不再需要：
# CONFIG_USE_SEGGER_RTT is unset
# CONFIG_LOG_BACKEND_RTT is unset
# CONFIG_LOG_PRINTK is unset

# ── 若不用硬件 UARTE0，就关掉 ─────────────────────
CONFIG_NRFX_UARTE0=n

# ── Bluetooth (Central + Peripheral, multi-conn, security) ──
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

CONFIG_BT_NUS=y
CONFIG_BT_NUS_CLIENT=y

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_GATT_DM=y

CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# ── Settings storage (bonding) ────────────────
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ── Stacks / heap ─────────────────────────────
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ── Large MTU / DLE buffers ────────────────────
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT=12
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=12
CONFIG_BT_L2CAP_TX_MTU=247

# ── Peripherals ───────────────────────────────
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_DK_LIBRARY=y
